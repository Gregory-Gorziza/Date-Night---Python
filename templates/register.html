{% extends "base.html" %}

{% block title %}Cadastro - DateNight{% endblock %}

{% block content %}
<div class="form-page">
<div class="page-heading">
<p class="eyebrow">Date Night</p>
<h1>Crie seu perfil</h1>
</div>
<form class="glass-card profile-card" method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
{% set account_mode = 'register' %}
{% include '_profile_fields.html' %}
<button class="btn btn-complete" type="submit">Concluir cadastro</button>
</form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/photo-upload.js') }}" defer></script>
{% endblock %}
