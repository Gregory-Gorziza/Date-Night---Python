{% extends "base.html" %}

{% block title %}Meu Perfil - DateNight{% endblock %}

{% block content %}
<div class="glass-card">
    <h2>Meu Perfil</h2>
    <form method="POST" action="{{ url_for('profile') }}">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" class="form-control" value="{{ user.nome }}" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail (somente leitura)</label>
            <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled>
        </div>
        
        <!-- Outros campos podem ser adicionados aqui -->
        
        <button type="submit" class="btn">Atualizar Perfil</button>
    </form>
</div>
{% endblock %}
